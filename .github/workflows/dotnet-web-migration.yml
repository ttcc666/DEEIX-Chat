name: .NET Web Migration Checks

on:
  push:
    branches:
      - "migration/dotnet-web-*"
  pull_request:
    branches: [dev]
    paths:
      - "docs/migration/**"
      - "backend-dotnet/**"
      - ".github/workflows/dotnet-web-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-web-migration-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.17.0
  SIDECAR_TAGS: nopostgres,noredis,nos3,noswagger,nomsgpack,nootlp

jobs:
  audit:
    name: Migration audit artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate migration inventories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          root = Path("docs/migration")
          required = [
              "00-SOURCE-BASELINE.md", "01-WEB-SCOPE-AND-EXCLUSIONS.md",
              "02-WEB-DEPENDENCY-MAP.md", "03-API-INVENTORY.csv",
              "03A-WEB-API-CALLERS.csv", "03B-GO-ROUTE-HANDLERS.csv",
              "03C-ROUTE-COVERAGE-REPORT.md", "03D-WEB-ONLY-UNSWAGGERED-ROUTES.csv", "03E-WEB-ROUTE-REVIEW.csv",
              "04-API-COMPATIBILITY-MATRIX.md", "05-DATABASE-SCHEMA-INVENTORY.md",
              "05B-DATABASE-INDEX-INVENTORY.md", "06-DATABASE-TABLE-MAPPING.csv",
              "06B-DATABASE-FIELD-INVENTORY.csv", "06C-DATABASE-GORM-INDEX-MEMBERS.csv",
              "06D-POSTGRES-CUSTOM-DDL.csv", "06E-VECTOR-STORAGE-INVENTORY.csv", "scripts/compare-db-catalogs.py",
              "07-AUTH-CRYPTO-COMPATIBILITY.md", "08-PROVIDER-COMPATIBILITY-MATRIX.md",
              "09-MCP-COMPATIBILITY.md", "10-FILES-RAG-MEMORY-MAPPING.md",
              "11-BILLING-PAYMENT-COMPATIBILITY.md", "12-WEB-DEPLOYMENT-ANALYSIS.md",
              "13-TEST-INVENTORY.md", "14-RISK-REGISTER.md",
              "15-FEATURE-MIGRATION-MATRIX.md", "PHASE-0-GATE-REPORT.md"
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"Missing migration audit files: {missing}")

          def load(name):
              with (root / name).open(newline="", encoding="utf-8") as f:
                  return list(csv.DictReader(f))

          api_rows = load("03-API-INVENTORY.csv")
          web_rows = load("03A-WEB-API-CALLERS.csv")
          go_rows = load("03B-GO-ROUTE-HANDLERS.csv")
          extra_web_rows = load("03D-WEB-ONLY-UNSWAGGERED-ROUTES.csv")
          review_rows = load("03E-WEB-ROUTE-REVIEW.csv")
          table_rows = load("06-DATABASE-TABLE-MAPPING.csv")
          field_rows = load("06B-DATABASE-FIELD-INVENTORY.csv")
          index_rows = load("06C-DATABASE-GORM-INDEX-MEMBERS.csv")
          ddl_rows = load("06D-POSTGRES-CUSTOM-DDL.csv")
          vector_rows = load("06E-VECTOR-STORAGE-INVENTORY.csv")

          expected = {
              "Swagger operations": (len(api_rows), 343),
              "Web caller rows": (len(web_rows), 329),
              "Go route registrations": (len(go_rows), 344),
              "Web-used undocumented routes": (len(extra_web_rows), 0),
              "Reviewed non-Web routes": (len(review_rows), 17),
              "GORM table mappings": (len(table_rows), 65),
              "GORM field rows": (len(field_rows), 886),
              "GORM index members": (len(index_rows), 430),
              "PostgreSQL custom DDL": (len(ddl_rows), 87),
              "SQLite vector tables": (len(vector_rows), 3),
          }
          for label, (actual, wanted) in expected.items():
              if actual != wanted:
                  raise SystemExit(f"{label}: expected {wanted}, found {actual}")

          if any(not row["go_handler"] for row in api_rows):
              raise SystemExit("Every Swagger operation must map to a Go handler")
          if sum(row["web_caller_mapping"] == "PATH_MATCH_ONLY" for row in api_rows) != 324:
              raise SystemExit("Expected 324 direct Web path matches; review API caller inventory")
          if sum(row["web_caller_mapping"] == "INDIRECT_IMAGE_MATCH" for row in api_rows) != 2:
              raise SystemExit("Expected 2 indirect browser-image callers; review caller inventory")
          expected_mapping_counts = {
              "PATH_MATCH_ONLY": 324,
              "INDIRECT_IMAGE_MATCH": 2,
              "WEB_SCOPE_EXCLUDED_RUNTIME_ACTION": 6,
              "DESKTOP_ONLY_EXCLUDED": 1,
              "BROWSER_REDIRECT_CALLBACK": 1,
              "PROVIDER_CALLBACK_NO_WEB_CALLER": 3,
              "STATIC_RESOURCE_ALIAS": 1,
              "SUPERSEDED_BY_BATCH_API": 1,
              "NO_WEB_CALLER_REVIEWED": 4,
          }
          mapping_counts = {}
          for row in api_rows:
              key = row["web_caller_mapping"]
              mapping_counts[key] = mapping_counts.get(key, 0) + 1
          if mapping_counts != expected_mapping_counts:
              raise SystemExit(f"Web caller classifications differ: {mapping_counts}")
          reviewed_keys = {(row["http_method"], row["path"]) for row in review_rows}
          non_web_keys = {
              (row["http_method"], row["path"])
              for row in api_rows
              if row["web_caller_mapping"] not in {"PATH_MATCH_ONLY", "INDIRECT_IMAGE_MATCH"}
          }
          if reviewed_keys != non_web_keys:
              raise SystemExit("The non-Web API routes and the explicit route review must match")
          if sum(row["has_body_parameter"] == "true" for row in api_rows) != 145:
              raise SystemExit("Expected 145 Swagger request bodies")
          if sum(bool(row["request_body_schema"]) for row in api_rows) != 145:
              raise SystemExit("Request body schema extraction is incomplete")
          if sum(bool(row["response_schemas"]) for row in api_rows) != 343:
              raise SystemExit("Response schema extraction is incomplete")
          auth_counts = {}
          for row in api_rows:
              auth_counts[row["go_auth_context"]] = auth_counts.get(row["go_auth_context"], 0) + 1
          expected_auth = {
              "AUTHENTICATED+ADMIN_ONLY": 169,
              "AUTHENTICATED": 149,
              "PUBLIC_RATE_LIMITED": 23,
              "LOCAL_MODE_ONLY": 1,
              "PUBLIC_NO_AUTH": 1,
          }
          if auth_counts != expected_auth:
              raise SystemExit(f"Go auth context counts differ: {auth_counts}")
          if any(row["migration_status"] != "EXPLICIT_TABLE_NAME_VERIFIED" for row in table_rows):
              raise SystemExit("Every GORM table name must be explicitly source-verified")
          if any(row["swagger_status"] != "MISSING_FROM_SWAGGER" for row in extra_web_rows):
              raise SystemExit("Unexpected status in Web-only undocumented routes")
          if any(row["compatibility_status"] != "NOT_MAPPED" for row in api_rows):
              raise SystemExit("Do not mark compatibility complete before implementation")
          if any(row["dotnet_implementation"] != "NOT_STARTED" for row in api_rows):
              raise SystemExit("Do not mark .NET implementation started from an inventory-only commit")

          print("Validated source inventory: 343 Swagger operations, 0 Web-used undocumented routes, 17 reviewed non-Web routes, 145 request schemas, 343 response schemas, 344 Go routes, 324 direct + 2 indirect Web callers, 65 tables, 886 fields, 430 index members, 87 PostgreSQL DDL statements and 3 vector tables.")
          PY

  go-baseline:
    name: Go baseline (including Desktop sidecar tags)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Lint
        run: make lint
      - name: Build default
        run: go build ./...
      - name: Build Desktop sidecar tag set
        run: go build -tags "$SIDECAR_TAGS" ./...
      - name: Test default
        run: go test ./...
      - name: Test Desktop sidecar tag set
        run: go test -tags "$SIDECAR_TAGS" ./internal/infra/observability/tracing/... ./internal/infra/openwebui/... ./internal/infra/persistence/...

  postgres-integration:
    name: PostgreSQL persistence integration (ephemeral pgvector)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: deeix_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deeix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DEEIX_TEST_DATABASE_DSN: postgres://postgres:postgres@localhost:5432/deeix_test?sslmode=disable
      DEEIX_TEST_CATALOG_DIR: ${{ github.workspace }}/migration-catalog-output
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Prepare catalog output directory
        run: mkdir -p "$DEEIX_TEST_CATALOG_DIR"
      - name: Enable pgvector extension
        run: psql "$DEEIX_TEST_DATABASE_DSN" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Run PostgreSQL persistence integration tests and export catalog
        run: go test -count=1 -v ./internal/infra/persistence/postgres/...
      - name: Export SQLite migration catalog
        run: go test -count=1 -v ./internal/infra/persistence/sqlite/...
      - name: Compare physical catalogs with source inventories
        run: python3 ../docs/migration/scripts/compare-db-catalogs.py --catalog-dir "$DEEIX_TEST_CATALOG_DIR"
      - name: Upload isolated migration catalog snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-database-catalog-${{ github.run_id }}
          path: ${{ github.workspace }}/migration-catalog-output/
          if-no-files-found: warn

  web-baseline:
    name: Web baseline (checks, tests and static build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check (lint, types, architecture, API contract)
        run: pnpm turbo run check --filter=@deeix/web --filter=./packages/*
      - name: Test
        run: pnpm turbo run test --filter=./packages/*
      - name: Build static Web
        run: pnpm turbo run build --filter=@deeix/web

  detect-dotnet:
    name: Detect .NET solution
    runs-on: ubuntu-24.04
    outputs:
      has_solution: ${{ steps.detect.outputs.has_solution }}
    steps:
      - uses: actions/checkout@v5
      - id: detect
        shell: bash
        run: |
          if [ -d backend-dotnet ] && find backend-dotnet -type f \( -name '*.sln' -o -name '*.slnx' \) -print -quit | grep -q .; then
            echo "has_solution=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_solution=false" >> "$GITHUB_OUTPUT"
          fi

  dotnet:
    name: .NET 10 build and tests
    needs: detect-dotnet
    if: needs.detect-dotnet.outputs.has_solution == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        shell: bash
        run: |
          set -euo pipefail
          solution="$(find backend-dotnet -type f \( -name '*.sln' -o -name '*.slnx' \) -print -quit)"
          test -n "$solution"
          dotnet restore "$solution"
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          solution="$(find backend-dotnet -type f \( -name '*.sln' -o -name '*.slnx' \) -print -quit)"
          dotnet build "$solution" --configuration Release --no-restore
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          solution="$(find backend-dotnet -type f \( -name '*.sln' -o -name '*.slnx' \) -print -quit)"
          dotnet test "$solution" --configuration Release --no-build --logger "trx;LogFileName=dotnet-tests.trx"
